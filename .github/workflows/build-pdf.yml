name: Build documentation PDF

on:
  pull_request:
    paths:
      - "README.md"
      - "methodology/**"
      - "guides/**"
      - "architecture/**"
      - "build-pipeline/**"
      - ".github/workflows/build-pdf.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "methodology/**"
      - "guides/**"
      - "architecture/**"
      - "build-pipeline/**"
      - ".github/workflows/build-pdf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Build handbook
        run: uv run --with-requirements build-pipeline/requirements.txt python build-pipeline/generate_pdf.py
      - name: Validate PDF and render pages
        run: |
          test -s output/pdf/indiekator-docs.pdf
          pdfinfo output/pdf/indiekator-docs.pdf
          mkdir -p tmp/pdfs
          pdftoppm -png output/pdf/indiekator-docs.pdf tmp/pdfs/page
          test "$(find tmp/pdfs -name '*.png' | wc -l)" -gt 0
      - name: Upload handbook
        uses: actions/upload-artifact@v4
        with:
          name: indiekator-docs-pdf
          path: output/pdf/indiekator-docs.pdf
          retention-days: 14
